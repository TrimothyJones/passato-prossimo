name: Alpha feedback
description: Share a useful, confusing, or surprising moment from the reading loop.
title: "[Alpha feedback]: "
labels:
  - alpha-feedback
body:
  - type: markdown
    attributes:
      value: A short description is enough. Please do not include copyrighted passages, private URLs, or personal information.
  - type: textarea
    id: tried
    attributes:
      label: What did you try?
    validations:
      required: true
  - type: textarea
    id: useful
    attributes:
      label: What felt unexpectedly useful?
  - type: textarea
    id: confusing
    attributes:
      label: What felt confusing or interrupted your reading?
  - type: textarea
    id: wanted
    attributes:
      label: What did you want the app to do in that moment?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private reading content, URLs, and personal information.
          required: true
