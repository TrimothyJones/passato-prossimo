name: Bug report
description: Report something broken, slow, or unresponsive in the public alpha.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please do not paste copyrighted passages, private URLs, or personal information into this public issue.
  - type: input
    id: version
    attributes:
      label: Passato Prossimo version
      placeholder: 0.6.0-alpha.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 10 or Windows 11
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source type
      options:
        - Built-in sample
        - TXT
        - EPUB
        - Article URL
        - Local audio or video
        - Direct media URL
        - YouTube
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Describe the behavior without including the source text or private link.
    validations:
      required: true
  - type: dropdown
    id: repeat
    attributes:
      label: Did it happen again?
      options:
        - Yes, every time
        - Sometimes
        - No
        - I did not retry
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private reading content, URLs, and personal information.
          required: true
